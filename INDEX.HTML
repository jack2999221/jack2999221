<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lectura de sincronía mística</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="STYLE.CSS" />
</head>
<body>
  <main class="page">
    <section class="header">
      <p class="eyebrow">Lectura de sincronía mística</p>
      <h1>La selección no es caótica — está sincronizada con tu vibración numérica</h1>
    </section>

    <form class="oracle-form" action="#" method="post">
      <div class="row">
        <label class="field">
          <span>Fecha de nacimiento</span>
          <input type="date" name="birthDate" value="1996-03-27" required />
        </label>

        <label class="field">
          <span>Fecha de consulta</span>
          <input type="date" name="readingDate" id="readingDate" required />
        </label>
      </div>

      <label class="field full">
        <span>Nombre o iniciales (opcional)</span>
        <input type="text" name="initials" maxlength="25" placeholder="Ej: JAHB" />
      </label>

      <button class="cta" type="submit">Revelar mis cartas</button>
    </form>
  </main>

  <script>
    const today = new Date().toISOString().split("T")[0];
    document.getElementById("readingDate").value = today;
  </script>
</body>
</html>
